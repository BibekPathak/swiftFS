services:
  swiftfs:
    build: .
    # FUSE mounts require the device and appropriate capabilities.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./images:/images
      - ./mnt:/mnt
    command: ["--help"]
